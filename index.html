<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Simple</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <div class="contenedor">

        <h1>Calculadora</h1>

        <input type="number" id="numero1" placeholder="Ingrese un número">

        <input type="number" id="numero2" placeholder="Ingrese otro número">

        <div class="botones">

            <button onclick="sumar()">
                Sumar
            </button>

            <button onclick="restar()">
                Restar
            </button>

            <button onclick="multiplicar()">
                Multiplicar
            </button>

            <button onclick="dividir()">
                Dividir
            </button>

        </div>

        <h2 id="resultado">
            Resultado:
        </h2>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
